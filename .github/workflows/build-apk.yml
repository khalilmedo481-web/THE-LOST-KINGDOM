name: Build and publish THE LOST KINGDOM Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, city-runner ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK package, contents and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.cityrunner.endless'" /tmp/apk-badging.txt
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'classes.dex'

      - name: Upload APK artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: THE-LOST-KINGDOM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: city-runner-build-${{ github.run_number }}
          name: CITY RUNNER 3D - Android build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            نسخة Android تجريبية للعبة CITY RUNNER.
            الحد الأدنى Android 5.0، وتعمل دون اتصال بالإنترنت.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false

      - name: Print direct download link
        run: |
          echo "APK: https://github.com/${{ github.repository }}/releases/download/city-runner-build-${{ github.run_number }}/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
