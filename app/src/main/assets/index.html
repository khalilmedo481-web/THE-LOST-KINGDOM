<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071426"><title>CITY RUNNER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071426;font-family:system-ui,Arial;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #001}#top{display:flex;justify-content:space-between;padding:16px;font-weight:900;font-size:clamp(16px,4vw,23px)}.pill{background:#06172bc9;border:1px solid #ffffff35;border-radius:18px;padding:8px 14px;backdrop-filter:blur(6px)}#center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(88%,430px);text-align:center;pointer-events:auto;background:linear-gradient(155deg,#102d50ed,#071426ed);border:2px solid #64eaff88;border-radius:26px;padding:25px 20px;box-shadow:0 18px 70px #0009}h1{font-size:clamp(35px,9vw,58px);line-height:1;margin:5px 0 12px;color:#ffd84d;text-shadow:0 4px 0 #b64b19,0 0 24px #ffb52c88;letter-spacing:1px}p{color:#d7edff;line-height:1.6;margin:10px 0 18px}button{border:0;border-radius:16px;background:linear-gradient(180deg,#ffe86b,#ff9e22);color:#39200a;font-weight:1000;font-size:20px;padding:14px 34px;box-shadow:0 5px 0 #b85d17;cursor:pointer}#hint{font-size:13px;color:#b9d7ee;margin-top:16px}#over{display:none}#bottom{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#ffffffb9;font-weight:700;font-size:12px}#toast{position:absolute;top:19%;left:50%;transform:translateX(-50%);font-weight:900;color:#ffe46b;font-size:22px;opacity:0}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="top"><div class="pill">🏆 <span id="score">0</span></div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">⚡ <span id="speed">1x</span></div></div><div id="toast">+100</div><div id="center"><div style="font-size:42px">🚇🌆</div><h1>CITY RUNNER</h1><p>اجري بأقصى سرعة! تفادى القطارات والحواجز واجمع العملات.</p><button id="start">ابدأ الجري</button><div id="hint">اسحب يمين / شمال للتغيير • أعلى للقفز • أسفل للانزلاق</div><div id="over"><h2 style="color:#ffe46b">انتهى السباق!</h2><p>نتيجتك: <b id="final">0</b>　🪙 <b id="finalcoins">0</b></p><button id="again">العب تاني</button></div></div><div id="bottom">CITY RUNNER • endless city adventure</div></div>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,1.7);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);let running=false,dead=false,lane=0,score=0,coins=0,speed=1,dist=0,last=0,spawn=0,items=[],jump=0,slide=0,flash=0;
const horizon=()=>H*.32, ground=()=>H*.91;
function project(z,l){let t=1-z;let y=horizon()+Math.pow(t,1.7)*(ground()-horizon());let spread=W*(.055+.42*Math.pow(t,1.15));return {x:W/2+l*spread,y,s:0.18+1.12*t}}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawSky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#54c8ef');g.addColorStop(.5,'#f6bb78');g.addColorStop(1,'#ffe0a0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
let hy=horizon();ctx.fillStyle='#ffdc8c';ctx.beginPath();ctx.arc(W*.78,H*.2,Math.min(W,H)*.07,0,7);ctx.fill();
for(let side of [-1,1]){for(let i=0;i<12;i++){let z=((i/12+dist*.00018)%1),t=1-z,y=hy+Math.pow(t,1.7)*(ground()-hy),x=W/2+side*(W*(.12+.66*Math.pow(t,1.1)));let bh=(.07+.16*((i*17)%9)/9)*H*Math.pow(t,.4),bw=(.045+.035*(i%3))*W*Math.max(.25,t);ctx.fillStyle=['#24516a','#34677a','#52727b','#30465e'][i%4];ctx.fillRect(x-bw/2,y-bh,bw,bh);ctx.fillStyle='#ffdb8b';for(let wy=y-bh+8;wy<y-5;wy+=13)for(let wx=x-bw/2+5;wx<x+bw/2-4;wx+=12)ctx.fillRect(wx,wy,4,5)}}}
function drawTrack(){let hy=horizon(),gy=ground();ctx.fillStyle='#65747b';ctx.beginPath();ctx.moveTo(W*.34,hy);ctx.lineTo(W*.66,hy);ctx.lineTo(W*1.3,H);ctx.lineTo(-W*.3,H);ctx.fill();
for(let l=-1;l<=1;l++){let a=project(0,l),b=project(1,l);ctx.strokeStyle='#dce6e4';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W/2+l*W*.045,hy);ctx.lineTo(W/2+l*W*.43,gy);ctx.stroke()}
for(let i=0;i<18;i++){let z=((i/18+dist*.00075)%1),p=project(z,0),width=W*(.04+.75*Math.pow(1-z,1.2));ctx.strokeStyle='#c4b6a0';ctx.lineWidth=3+z*5;ctx.beginPath();ctx.moveTo(p.x-width/2,p.y);ctx.lineTo(p.x+width/2,p.y);ctx.stroke()}
}
function drawCoin(o){let p=project(o.z,o.l),r=11*p.s;ctx.save();ctx.translate(p.x,p.y-25*p.s);ctx.scale(.72+Math.abs(Math.sin(dist*.012+o.z*9))*.28,1);ctx.fillStyle='#ffb51b';ctx.strokeStyle='#fff18a';ctx.lineWidth=3*p.s;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff3a4';ctx.font='bold '+(r*1.15)+'px Arial';ctx.textAlign='center';ctx.fillText('$',0,r*.38);ctx.restore()}
function drawObstacle(o){let p=project(o.z,o.l),s=p.s,w=58*s,h=60*s,x=p.x-w/2,y=p.y-h;
if(o.type==='train'){rounded(x-13*s,y-75*s,w+26*s,h+75*s,10*s,'#147b91');rounded(x-7*s,y-67*s,w+14*s,31*s,7*s,'#a5e9f1');rounded(x-7*s,y-27*s,w+14*s,25*s,5*s,'#263b53');ctx.fillStyle='#f6d04e';ctx.fillRect(x-13*s,y-6*s, w+26*s,6*s)}
else if(o.type==='bar'){rounded(x-10*s,y+18*s,w+20*s,18*s,5*s,'#ff9c24');ctx.fillStyle='#fff1c7';ctx.fillRect(x-4*s,y+20*s,9*s,14*s);ctx.fillRect(x+20*s,y+20*s,9*s,14*s)}
else{rounded(x,y+20*s,w,h*.65,7*s,'#d65a36');rounded(x+8*s,y+27*s,w-16*s,14*s,4*s,'#ffce68');ctx.fillStyle='#6b3028';ctx.fillRect(x+9*s,y+h*.6,w-18*s,7*s)}
}
function drawRunner(){let p=project(0,lane),x=p.x,y=ground()-10;let j=jump>0?Math.sin((1-jump)*Math.PI)*H*.19:0;y-=j;let s=Math.min(W,H)/420;ctx.save();ctx.translate(x,y);ctx.scale(s,s);if(slide>0){ctx.rotate(-.12);rounded(-23, -22,46,26,12,'#12a9c5');ctx.fillStyle='#f0b98d';ctx.beginPath();ctx.arc(20,-22,12,0,7);ctx.fill()}else{ctx.fillStyle='#101a2d';ctx.beginPath();ctx.ellipse(-10,0,10,5,0,0,7);ctx.ellipse(12,0,10,5,0,0,7);ctx.fill();rounded(-17,-48,34,43,10,'#10a6c6');ctx.fillStyle='#e9a77b';ctx.beginPath();ctx.arc(0,-62,15,0,7);ctx.fill();rounded(-16,-79,32,8,5,'#f4b72f');ctx.fillStyle='#172b45';ctx.fillRect(-11,-65,7,4);ctx.fillRect(4,-65,7,4);ctx.strokeStyle='#f3c2a0';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-15,-39);ctx.lineTo(-25,-22+Math.sin(dist*.03)*4);ctx.moveTo(15,-39);ctx.lineTo(24,-22-Math.sin(dist*.03)*4);ctx.stroke();ctx.fillStyle='#263c68';ctx.fillRect(-13,-9,11,10);ctx.fillRect(3,-9,11,10)}ctx.restore()}
function frame(t){let dt=Math.min((t-last)/16||1,2.5);last=t;if(running){dist+=dt*speed;score+=Math.floor(dt*speed*.22);speed=1+Math.min(2.2,score/1800);spawn-=dt;if(spawn<=0){let l=Math.floor(Math.random()*3)-1,types=['train','bar','box'];items.push({l,z:1,type:types[Math.floor(Math.random()*types.length)]});if(Math.random()<.7)for(let k=0;k<4;k++)items.push({l,z:1-k*.075,type:'coin'});spawn=Math.max(24,65-speed*12)}if(jump>0)jump=Math.max(0,jump-dt*.025);if(slide>0)slide=Math.max(0,slide-dt*.025);items.forEach(o=>o.z-=dt*(.006+speed*.0015));items=items.filter(o=>o.z>-.08);for(let o of items){if(o.z<.085&&o.z>-.025&&o.l===lane){if(o.type==='coin'){coins++;o.z=-1;flash=12}else if((o.type==='bar'&&jump<=0)||(o.type==='box'&&slide<=0)||(o.type==='train')){end();break}}} }
drawSky();drawTrack();items.slice().sort((a,b)=>b.z-a.z).forEach(o=>o.type==='coin'?drawCoin(o):drawObstacle(o));drawRunner();if(flash>0){flash--;let el=$('toast');el.style.opacity=flash/12;el.style.top=(19-flash*.2)+'%'}$('score').textContent=score;$('coins').textContent=coins;$('speed').textContent=speed.toFixed(1)+'x';requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function start(){running=true;dead=false;score=0;coins=0;speed=1;dist=0;lane=0;jump=0;slide=0;items=[];spawn=20;$('center').style.display='none'}
function end(){if(dead)return;dead=true;running=false;$('center').style.display='block';$('start').style.display='none';$('over').style.display='block';$('final').textContent=score;$('finalcoins').textContent=coins}
$('start').onclick=start;$('again').onclick=()=>{$('start').style.display='inline-block';$('over').style.display='none';start()};
function move(dir){if(!running)return;if(dir==='left')lane=Math.max(-1,lane-1);if(dir==='right')lane=Math.min(1,lane+1);if(dir==='up'&&jump<=0&&slide<=0)jump=1;if(dir==='down'&&jump<=0)slide=1}
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up')});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move('left');if(e.key==='ArrowRight'||e.key==='d')move('right');if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')move('up');if(e.key==='ArrowDown'||e.key==='s')move('down')});
})();
</script></body></html>
