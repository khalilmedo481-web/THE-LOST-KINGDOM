plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lostkingdom.game'
    compileSdk 35

    defaultConfig {
        // Separate package so this 3D test build can install beside an older build.
        applicationId 'com.lostkingdom.game3d'
        minSdk 21
        targetSdk 28
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
